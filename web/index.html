<!doctype html>
<meta charset="utf-8">
<title>Switchboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/style.css">
<div id="notif-bar" hidden>
  <span id="notif-msg"></span>
  <button id="notif-btn" type="button">Enable notifications</button>
</div>
<main id="grid"></main>
<section id="graph" hidden>
  <header><button id="graph-back">← grid</button><h2 id="graph-title"></h2></header>
  <div id="graph-map"><svg id="graph-svg"></svg><div id="graph-rows"></div></div>
</section>
<section id="chat" hidden>
  <header><button id="back">← grid</button><h2 id="chat-title"></h2><span id="chat-auto"></span></header>
  <div id="transcript"></div>
  <form id="composer">
    <label id="attach" title="Attach files">📎<input type="file" multiple hidden></label>
    <input id="prompt" placeholder="Message…" autocomplete="off">
    <button id="schedule-btn" type="button" title="Schedule this message">⏱</button>
    <button>Send</button>
  </form>
  <p id="upload-error"></p>
</section>
<dialog id="new">
  <form method="dialog">
    <h2>New worktree</h2>
    <!-- A native <datalist> is an OS widget: unstylable, and it clips long
         absolute paths to the input's width, which is exactly the information
         you need to pick a repo. Replaced with a real combobox. -->
    <div class="field">
      <label for="repo-input">Repo</label>
      <div class="combo">
        <input id="repo-input" name="repo" required autocomplete="off" spellcheck="false"
               placeholder="/path/to/repo" role="combobox" aria-expanded="false"
               aria-controls="repo-list" aria-autocomplete="list">
        <ul class="combo-list" id="repo-list" role="listbox" aria-label="Recent repos" hidden></ul>
      </div>
      <p class="hint">Paths Claude Code has opened before. Type any other path.</p>
    </div>
    <div class="field">
      <label for="branch-input">Branch</label>
      <input id="branch-input" name="branch" required placeholder="feat/thing"
             autocomplete="off" spellcheck="false">
    </div>
    <div class="field">
      <label for="account-select">Account</label>
      <div class="select-wrap"><select id="account-select" name="account"></select></div>
    </div>
    <div class="field">
      <label for="when-select">Run</label>
      <div class="select-wrap"><select id="when-select" name="when">
        <option value="now">Now</option>
        <option value="at">At a time…</option>
        <option value="reset">When usage resets</option>
      </select></div>
      <!-- Native picker: no date library, and it hands back a local wall-clock
           string that `new Date()` parses as local time, which is what the user
           meant. -->
      <input id="when-at" name="at" type="datetime-local" hidden>
    </div>
    <div class="field">
      <label for="prompt-input">First prompt</label>
      <textarea id="prompt-input" name="prompt" required rows="3"
                placeholder="What should the agent do?"></textarea>
    </div>
    <p id="new-error"></p>
    <!-- formnovalidate: without it, Cancel is still a type=submit button inside
         a form with required fields, so clicking it while any of them are
         empty runs the browser's native constraint validation and blocks the
         dialog's method="dialog" close entirely — Cancel silently does
         nothing on the form's default (empty) state. -->
    <menu><button value="cancel" formnovalidate>Cancel</button><button id="create" value="create">Create worktree</button></menu>
  </form>
</dialog>
<dialog id="when-dialog">
  <form method="dialog">
    <h2>Schedule message</h2>
    <div class="field">
      <label for="when2-select">Run</label>
      <div class="select-wrap"><select id="when2-select" name="when">
        <option value="at">At a time…</option>
        <option value="reset">When usage resets</option>
      </select></div>
      <input id="when2-at" name="at" type="datetime-local">
    </div>
    <p id="when-error"></p>
    <menu><button value="cancel" formnovalidate>Cancel</button><button value="ok">Schedule</button></menu>
  </form>
</dialog>
<script type="module" src="/app.js"></script>
