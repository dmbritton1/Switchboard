<!doctype html>
<meta charset="utf-8">
<title>Switchboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/style.css">
<header id="bar">
  <span id="brand">Switchboard</span>
  <span id="conn" hidden>reconnecting…</span>
  <div id="meters"></div>
  <button id="queue-badge" type="button" hidden></button>
  <button id="new-btn" type="button">+ New</button>
</header>
<div id="panel" hidden></div>
<div id="notif-bar" hidden>
  <span id="notif-msg"></span>
  <button id="notif-btn" type="button">Enable notifications</button>
</div>
<main id="grid"></main>
<p id="command-error" role="alert"></p>
<section id="session" hidden>
  <header>
    <button id="back">← grid</button>
    <h2 id="session-title"></h2>
    <p id="session-stopped-reason" class="meta" hidden></p>
    <span id="session-menu"></span>
  </header>
  <nav id="tabs" role="tablist"></nav>
  <div id="session-sticky">
    <div id="interrupt" hidden></div>
    <div id="session-action"></div>
  </div>

  <div id="pane-chat">
    <div id="transcript"></div>
    <div id="attachments" aria-live="polite"></div>
    <form id="composer">
      <button id="attach" type="button" aria-controls="attach-input">📎 Attach</button>
      <input id="attach-input" class="visually-hidden" type="file" multiple tabindex="-1"
             aria-label="Choose files to attach" aria-describedby="attachments">
      <input id="prompt" placeholder="Message…" autocomplete="off"><button type="submit">Send</button>
    </form>
    <p id="upload-error"></p>
  </div>

  <div id="pane-diff" hidden></div>

  <div id="pane-graph" hidden>
    <div id="graph-map"><svg id="graph-svg"></svg><div id="graph-rows"></div></div>
  </div>
</section>
<dialog id="new">
  <form method="dialog">
    <h2>New worktree</h2>
    <!-- A native <datalist> is an OS widget: unstylable, and it clips long
         absolute paths to the input's width, which is exactly the information
         you need to pick a repo. Replaced with a real combobox. -->
    <div class="field">
      <label for="repo-input">Repo</label>
      <div class="combo">
        <input id="repo-input" name="repo" required autocomplete="off" spellcheck="false"
               placeholder="/path/to/repo" role="combobox" aria-expanded="false"
               aria-controls="repo-list" aria-autocomplete="list">
        <ul class="combo-list" id="repo-list" role="listbox" aria-label="Recent repos" hidden></ul>
      </div>
      <p class="hint">Paths Claude Code has opened before. Type any other path.</p>
    </div>
    <div class="field">
      <label for="branch-input">Branch</label>
      <input id="branch-input" name="branch" required placeholder="feat/thing"
             autocomplete="off" spellcheck="false">
    </div>
    <div class="field">
      <label for="account-select">Account</label>
      <div class="select-wrap"><select id="account-select" name="account"></select></div>
    </div>
    <fieldset id="new-codex-settings" class="codex-settings" hidden>
      <legend>Codex settings</legend>
      <div class="field"><label for="new-codex-model">Model <span>Inherit</span></label>
        <input id="new-codex-model" name="model" placeholder="Inherit" maxlength="200"></div>
      <div class="field"><label for="new-codex-reasoning">Reasoning</label>
        <div class="select-wrap"><select id="new-codex-reasoning" name="reasoning">
          <option value="">Inherit</option><option value="minimal">minimal</option><option value="low">low</option>
          <option value="medium">medium</option><option value="high">high</option><option value="xhigh">xhigh</option>
        </select></div></div>
      <div class="field"><label for="new-codex-web-search">Web search</label>
        <div class="select-wrap"><select id="new-codex-web-search" name="webSearch">
          <option value="">Inherit</option><option value="disabled">disabled</option><option value="cached">cached</option><option value="live">live</option>
        </select></div></div>
      <div class="field"><label for="new-codex-network">Network</label>
        <div class="select-wrap"><select id="new-codex-network" name="network">
          <option value="">Inherit</option><option value="disabled">Disabled</option><option value="enabled">Enabled</option>
        </select></div></div>
    </fieldset>
    <div class="field">
      <label for="prompt-input">First prompt</label>
      <textarea id="prompt-input" name="prompt" required rows="3"
                placeholder="What should the agent do?"></textarea>
    </div>
    <p id="new-error"></p>
    <!-- formnovalidate: without it, Cancel is still a type=submit button inside
         a form with required fields, so clicking it while any of them are
         empty runs the browser's native constraint validation and blocks the
         dialog's method="dialog" close entirely — Cancel silently does
         nothing on the form's default (empty) state. -->
    <menu><button value="cancel" formnovalidate>Cancel</button><button id="create" value="create">Create worktree</button></menu>
  </form>
</dialog>
<dialog id="codex-settings-dialog">
  <form method="dialog">
    <h2>Codex settings</h2>
    <p id="codex-settings-summary" class="hint"></p>
    <fieldset class="codex-settings">
      <div class="field"><label for="codex-model">Model <span>Inherit</span></label>
        <input id="codex-model" name="model" placeholder="Inherit" maxlength="200"></div>
      <div class="field"><label for="codex-reasoning">Reasoning</label>
        <div class="select-wrap"><select id="codex-reasoning" name="reasoning">
          <option value="">Inherit</option><option value="minimal">minimal</option><option value="low">low</option>
          <option value="medium">medium</option><option value="high">high</option><option value="xhigh">xhigh</option>
        </select></div></div>
      <div class="field"><label for="codex-web-search">Web search</label>
        <div class="select-wrap"><select id="codex-web-search" name="webSearch">
          <option value="">Inherit</option><option value="disabled">disabled</option><option value="cached">cached</option><option value="live">live</option>
        </select></div></div>
      <div class="field"><label for="codex-network">Network</label>
        <div class="select-wrap"><select id="codex-network" name="network">
          <option value="">Inherit</option><option value="disabled">Disabled</option><option value="enabled">Enabled</option>
        </select></div></div>
    </fieldset>
    <menu><button value="cancel" formnovalidate>Cancel</button><button value="save">Save settings</button></menu>
  </form>
</dialog>
<dialog id="del">
  <form method="dialog">
    <h2>Delete session</h2>
    <p id="del-branch"></p>
    <!-- The checkbox lives inside the confirmation it modifies. On the card
         face it was one misclick from discarding uncommitted work. -->
    <label class="del-wt"><input type="checkbox" id="del-wt"> Also remove the git worktree</label>
    <p class="hint" id="del-hint"></p>
    <menu>
      <button value="cancel" formnovalidate>Cancel</button>
      <button id="del-go" value="delete">Delete</button>
    </menu>
  </form>
</dialog>
<script type="module" src="/app.js"></script>
